<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel Alares</title>
<link rel="icon" type="image/png" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <form id="lf" class="lbox" novalidate>
    <img src="assets/logo.png" alt="Alares" class="llogo">
    <h1>Painel administrativo</h1>
    <p class="muted">Entre com o e-mail e a senha criados no Firebase.</p>
    <label>E-mail<input id="le" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lp" type="password" autocomplete="current-password" required></label>
    <div id="lerr" class="err"></div>
    <button class="btn pri" type="submit" id="lbtn">Entrar</button>
    <button class="link" type="button" id="lreset">Esqueci minha senha</button>
  </form>
</div>

<!-- PAINEL -->
<div id="app" hidden>
  <header class="top">
    <img src="assets/logo.png" alt="Alares" class="tlogo">
    <span class="pill" id="state">Carregando…</span>
    <div class="grow"></div>
    <button class="btn ghost" id="bpv" title="Mostrar ou esconder a pré-visualização">Pré-visualização</button>
    <a class="btn ghost" href="index.html" target="_blank" rel="noopener">Abrir site</a>
    <button class="btn ghost" id="bdisc" title="Descartar o que ainda não foi publicado" hidden>Descartar</button>
    <button class="btn pri" id="bpub">Publicar</button>
    <button class="btn ghost" id="bout">Sair</button>
  </header>
  <div class="shell">
    <nav class="side" id="tabs"></nav>
    <main id="main"></main>
    <aside class="pv" id="pv">
      <div class="pvbar">
        <div class="seg" id="pvmode">
          <button data-m="d" class="on">Computador</button>
          <button data-m="m">Celular</button>
        </div>
        <button class="btn ghost sm" id="pvclose">Fechar</button>
      </div>
      <div class="pvbox" id="pvbox"><div class="pvwrap" id="pvwrap"><iframe id="pvf" title="Pré-visualização do site" src="index.html?preview=1"></iframe></div></div>
      <p class="pvhint">Mostra o que você está editando <b>antes</b> de publicar.</p>
    </aside>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="firebase-config.js"></script>
<script src="defaults.js"></script>
<script src="admin.js"></script>
</body>
</html>
